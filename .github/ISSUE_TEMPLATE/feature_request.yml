name: Feature request
description: Propose a focused user or operator capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note changes to authorization, commands, SSH, Provider access, data retention, APIs, or migrations.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used only synthetic examples and removed private infrastructure and personal information.
          required: true
