name: Publish backend image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # The repository is intentionally private before the first public release.
    # A manual dispatch or tag created during that phase must not allocate a runner.
    if: ${{ github.event.repository.private == false && github.repository == 'OrangeServers/OrangeServer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve release tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must use stable SemVer, for example v1.2.3"
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase GHCR image name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          echo "name=ghcr.io/${REPOSITORY_OWNER,,}/orangeserver-backend" >> "$GITHUB_OUTPUT"

      - name: Verify draft GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft
          )" || {
            echo "::error::create the Draft Release for $RELEASE_TAG before running this workflow"
            exit 1
          }
          if [ "$is_draft" != "true" ]; then
            echo "::error::$RELEASE_TAG must remain a Draft Release while assets are built and verified"
            exit 1
          fi

      - name: Reject an existing GHCR version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          error_file="$(mktemp)"
          if versions="$(
            gh api --paginate --slurp \
              "/orgs/${PACKAGE_OWNER}/packages/container/orangeserver-backend/versions?per_page=100" \
              2>"$error_file"
          )"; then
            if jq -e --arg tag "$RELEASE_TAG" \
              'flatten | any(.[]; ((.metadata.container.tags // []) | index($tag)) != null)' \
              <<<"$versions" >/dev/null; then
              echo "::error::GHCR tag $RELEASE_TAG already exists and must not be overwritten"
              exit 1
            fi
          elif grep -q 'HTTP 404' "$error_file"; then
            echo "GHCR package does not exist yet; this is the first image publish."
          else
            cat "$error_file" >&2
            echo "::error::could not verify GHCR tag immutability"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild release frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Cloud TCR
        if: ${{ vars.TCR_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve publish tags
        id: publish_tags
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TCR_ENABLED: ${{ vars.TCR_ENABLED }}
        shell: bash
        run: |
          {
            echo "value<<EOF"
            echo "${GHCR_IMAGE}:${RELEASE_TAG}"
            if [ "$TCR_ENABLED" = "true" ]; then
              echo "ccr.ccs.tencentyun.com/xuwei777/orangeserver-backend:${RELEASE_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.publish_tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Verify GHCR and TCR digests match
        if: ${{ vars.TCR_ENABLED == 'true' }}
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ghcr_digest="$(
            docker buildx imagetools inspect \
              "${GHCR_IMAGE}:${RELEASE_TAG}" \
              | awk '$1 == "Digest:" {print $2; exit}'
          )"
          tcr_digest="$(
            docker buildx imagetools inspect \
              "ccr.ccs.tencentyun.com/xuwei777/orangeserver-backend:${RELEASE_TAG}" \
              | awk '$1 == "Digest:" {print $2; exit}'
          )"
          if [ -z "$ghcr_digest" ] || [ "$ghcr_digest" != "$tcr_digest" ]; then
            echo "::error::GHCR and TCR digests differ"
            exit 1
          fi
          echo "Both registries published ${ghcr_digest}"

      - name: Build checksummed deployment bundle
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          bash ops/build-deploy-bundle.sh \
            --version "$RELEASE_TAG" \
            --output-dir release-assets

      - name: Attach deployment bundle to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/bootstrap-compose.sh" \
            "release-assets/bootstrap-compose-cn.sh" \
            "release-assets/orangeserver-deploy-${RELEASE_TAG}.tar.gz" \
            "release-assets/orangeserver-deploy-${RELEASE_TAG}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"
