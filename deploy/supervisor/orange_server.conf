; ============================================================
; OrangeServer Web (Flask + geventwebsocket)
; ============================================================
; REVIEW-15-P0-3: 路径全部环境化（%(ENV_xxx)s），
;   不再硬编码 /data/devops/OrangeServer /data/server/python371/bin，
;   复制整个 deploy/supervisor 目录到任意机器可直接 supervisord 启动
; REVIEW-15-P0-4: stop signal / wait / asgroup / priority 补齐，
;   解决 gevent worker 进程组残留 + 强杀丢 WebSocket 问题
; ============================================================
; 部署约定：
;   1) 将 deploy/supervisor/ 整个目录复制到 /etc/supervisor/conf.d/
;   2) /etc/supervisor/orange_server.env 写入环境变量：
;        OGS_PYTHON=/usr/bin/python3     (或 venv 全路径)
;        OGS_BIND_HOST=127.0.0.1         (生产 nginx 反代；本地调试改 0.0.0.0)
;        OGS_PORT=28000
;   3) supervisord -c /etc/supervisor/supervisord.conf
; ============================================================

[group:orange]
programs=orange-web

[program:orange-web]
; ---- 命令行 ----
;   生产：env-file 提供 OGS_PYTHON；本地 venv：OGS_PYTHON=/abs/path/to/venv/bin/python
command=%(ENV_OGS_PYTHON)s -m gunicorn
    -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker
    -w 1
    -b %(ENV_OGS_BIND_HOST)s:%(ENV_OGS_PORT)s
    --chdir %(ENV_OGS_HOME)s
    --access-logfile -
    --error-logfile -
    --log-level info
    --timeout 60
    --keep-alive 5
    wsgi:app

; ---- 工作目录 ----
directory=%(ENV_OGS_HOME)s

; ---- 进程标识 ----
process_name=%(program_name)s-%(process_num)s
numprocs=1
numprocs_start=28000

; ---- 生命周期 (REVIEW-15-P0-4) ----
autostart=true                ; supervisord 启动时拉起
autorestart=true              ; 异常退出自动重启
startsecs=3                   ; 至少存活 3s 才算启动成功
startretries=3                ; 启动失败重试次数
stopsignal=TERM               ; 先 TERM（让 gevent 排空 WebSocket）
stopwaitsecs=10               ; 给 10s 优雅退出
stopasgroup=true              ; TERM 整个进程组（含 gunicorn 子进程）
killasgroup=true              ; KILL 整个进程组

; ---- 日志 ----
;   ⓘ 日志目录需预创建, supervisor 不会自动建
;   推荐预创建: mkdir -p $(OGS_HOME)/log && chown -R root:root $(OGS_HOME)/log
;   轮转策略: stdout_logfile_maxbytes=50MB / backups=10 → 最长保留 500MB 日志
redirect_stderr=true          ; stderr 合并到 stdout
stdout_logfile=%(ENV_OGS_HOME)s/log/OrangeServer_%(process_num)s.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; ---- 优先级 (REVIEW-15-P0-4) ----
;   数字越小越先启动；redis/mysql 等依赖应在 1-100 区间
;   900 = web 业务进程，最后启动
priority=900

; ---- 环境变量 ----
;   注意: 密钥 (OGS_FLASK_SECRET_KEY / OGS_FERNET_KEYS) 不要写这里，
;   走 /etc/supervisor/orange_server.env 由 supervisord 加载后注入 ENV
;   ⓘ OGS_PROXY_LAYERS: 后端 ProxyFix 信任的反代层数（REV43-H4）
;     - 默认 1 (1 层 nginx 反代, 与本配置一致)
;     - 如果前面有 CDN/负载均衡器多层, 需调大, 否则日志/限流会取到 CDN IP
environment=
    OGS_ENV="prod",
    OGS_PROXY_LAYERS="1",
    PYTHONUNBUFFERED="1",
    PYTHONDONTWRITEBYTECODE="1"