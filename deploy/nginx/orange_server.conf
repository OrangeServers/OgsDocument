# =============================================================================
# OrangeServer nginx 反代配置（REVIEW-15 P1-8）
# =============================================================================
# 用途：
#   - nginx 终止 HTTPS（443），反代到 127.0.0.1:28000 后端 gunicorn
#   - 解决 P1-8：后端 gunicorn 绑 127.0.0.1 后，必须经 nginx 才能外部访问
#   - 同时承载 WebSocket 长连接（WebSSH / SFTP）
#
# 部署位置：
#   - /etc/nginx/conf.d/orange_server.conf
#   - 或 include 到主 nginx.conf 的 http{} 段
#
# 前置条件：
#   - 后端 gunicorn 监听 127.0.0.1:28000（OGS_BIND_HOST=127.0.0.1）
#   - 证书文件存在（生产用 Let's Encrypt 或公司 CA）
# =============================================================================

# ---------- 上游：后端 gunicorn ----------
upstream orange_server_backend {
    server 127.0.0.1:28000 fail_timeout=0;
    # 如需多 worker 负载均衡：
    # server 127.0.0.1:28001 fail_timeout=0;
    # server 127.0.0.1:28002 fail_timeout=0;
    keepalive 32;
}


# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge 必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 其余全部 301 → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ---- TLS 证书 ----
    ssl_certificate     /etc/nginx/ssl/orange_server.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/orange_server.privkey.pem;

    # ---- TLS 加固（按 Mozilla Intermediate 配置）----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- OCSP Stapling（减少 TLS 握手延迟 + 防 CA 撤销检查被防火墙拦截）----
    #   需要能访问 intermediate CA 的证书链 (fullchain.pem)
    #   生产需 resolver 指向本机可达的 DNS (8.8.8.8 / 1.1.1.1 / 内网 DNS)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ---- 通用安全头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 客户端 body 上限（防磁盘填充）----
    #   单位 m = 10^6 字节 (200m = 200,000,000), 与后端 OGS_SFTP_MAX_UPLOAD_SIZE=200MiB (209,715,200) 略小
    #   nginx 侧先触发 413 是安全行为 (留 5% 余量)
    client_max_body_size 200m;

    # ---- 日志 ----
    access_log /var/log/nginx/orange_server.access.log;
    error_log  /var/log/nginx/orange_server.error.log;

    # ---- 前端静态资源（DEPLOY-AUDIT P1-3）----
    #   后端不托管 dist（app/static 不存在），物理机必须由 nginx serve 前端；
    #   部署时把仓库 frontend/dist/ 同步到此目录。
    root /opt/orangeserver/app/frontend/dist;
    index index.html;

    # ---- 健康检查代理（HTTP 直查，不进 access 日志）----
    location = /local/health {
        access_log off;
        proxy_pass http://orange_server_backend;
    }

    # ---- WebSocket 路由（WebSSH + SFTP）----
    #   长连接超时 1 小时（与后端 ssh_cmd_max_output_bytes 匹配）
    location /local/websocket {
        proxy_pass http://orange_server_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /local/sftp/websocket {
        proxy_pass http://orange_server_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- AI Agent（POST SSE 流式响应）----
    location /ai/ {
        proxy_pass http://orange_server_backend;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";
    }

    # SETUP-WIZARD: 首次部署配置向导 API（apply 含建库，放宽读超时）
    location /setup/api/ {
        proxy_pass http://orange_server_backend;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ---- 其余 API 前缀反代（DEPLOY-AUDIT P1-3: 与容器版 conf 对齐为显式前缀）----
    location ~ ^/(local|account|server|mail|auth)/ {
        proxy_pass http://orange_server_backend;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端超时：写 60s（文件上传）+ 读 60s（普通 API）+ 空闲 600s
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- SPA 静态资源 + history 路由 fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
