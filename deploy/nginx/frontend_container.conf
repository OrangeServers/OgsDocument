# =============================================================================
# ogs-frontend 容器专用 nginx 配置 (REV48 + REV49)
# =============================================================================
# 与物理机版 orange_server.conf 的区别：
#   1. upstream 用 compose 服务名 backend:28000
#      如用 --network host 模式部署, 需改为 127.0.0.1:<OGS_PORT>
#   2. 静态 serve /usr/share/nginx/html (frontend/dist 挂载点), SPA fallback
#   3. 只反代后端真实使用的 API 前缀 + 2 个 WebSocket 路径
#   4. 不配 TLS. 生产 TLS 由外层 LB/nginx 终止, 届时 backend 再改 OGS_HTTPS=true
# =============================================================================

upstream ogs_backend {
    server backend:28000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ---- WebSocket (前缀比 /local/ 长, 优先匹配) ----
    location /local/websocket {
        proxy_pass http://ogs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /local/sftp/websocket {
        proxy_pass http://ogs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 后端 API 前缀 (与 frontend vite.config 的 proxy 列表一一对应) ----
    location /local/     { proxy_pass http://ogs_backend; include /etc/nginx/ogs_proxy_common.conf; }
    location /server/    { proxy_pass http://ogs_backend; include /etc/nginx/ogs_proxy_common.conf; }
    location /account/   { proxy_pass http://ogs_backend; include /etc/nginx/ogs_proxy_common.conf; }
    location /mail/      { proxy_pass http://ogs_backend; include /etc/nginx/ogs_proxy_common.conf; }
    location /auth/      { proxy_pass http://ogs_backend; include /etc/nginx/ogs_proxy_common.conf; }
    # AI 对话与批量命令审批使用 POST SSE，必须关闭代理缓冲。
    location /ai/ {
        proxy_pass http://ogs_backend;
        include /etc/nginx/ogs_proxy_common.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering "no";
    }

    # SETUP-WIZARD: 首次部署配置向导 API（apply 含建库，放宽读超时）
    location /setup/api/ {
        proxy_pass http://ogs_backend;
        include /etc/nginx/ogs_proxy_common.conf;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- SPA 静态资源 + history 路由 fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
